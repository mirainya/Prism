<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- White entry beam (into left face) -->
  <rect x="0" y="14" width="11" height="2" fill="#F0F4FF"/>
  <!-- Rainbow exit beams (from right face) -->
  <rect x="18" y="8" width="14" height="2" fill="#FF3B3B"/>
  <rect x="19" y="10" width="13" height="2" fill="#FF8C00"/>
  <rect x="20" y="12" width="12" height="2" fill="#FFD600"/>
  <rect x="21" y="14" width="11" height="2" fill="#3BD671"/>
  <rect x="22" y="16" width="10" height="2" fill="#3B82F6"/>
  <rect x="23" y="18" width="9" height="2" fill="#7C3AED"/>
  <rect x="24" y="20" width="8" height="2" fill="#D946EF"/>
  <!-- Prism glass body -->
  <g fill="#c0d8ef">
    <rect x="15" y="8" width="2" height="2"/>
    <rect x="14" y="10" width="4" height="2"/>
    <rect x="13" y="12" width="6" height="2"/>
    <rect x="12" y="14" width="8" height="2"/>
    <rect x="11" y="16" width="10" height="2"/>
    <rect x="10" y="18" width="12" height="2"/>
    <rect x="9" y="20" width="14" height="2"/>
  </g>
  <!-- Glass sparkle -->
  <g fill="#fff" fill-opacity="0.4">
    <rect x="15" y="8" width="1" height="1"/>
    <rect x="14" y="10" width="1" height="2"/>
  </g>
  <!-- Prism outline -->
  <g fill="#1e293b">
    <rect x="15" y="7" width="2" height="1"/>
    <rect x="14" y="8" width="1" height="2"/>
    <rect x="13" y="10" width="1" height="2"/>
    <rect x="12" y="12" width="1" height="2"/>
    <rect x="11" y="14" width="1" height="2"/>
    <rect x="10" y="16" width="1" height="2"/>
    <rect x="9" y="18" width="1" height="2"/>
    <rect x="8" y="20" width="1" height="2"/>
    <rect x="17" y="8" width="1" height="2"/>
    <rect x="18" y="10" width="1" height="2"/>
    <rect x="19" y="12" width="1" height="2"/>
    <rect x="20" y="14" width="1" height="2"/>
    <rect x="21" y="16" width="1" height="2"/>
    <rect x="22" y="18" width="1" height="2"/>
    <rect x="23" y="20" width="1" height="2"/>
    <rect x="8" y="22" width="16" height="1"/>
  </g>
</svg>
