# Docker Compose 环境配置
# 复制此文件为 config.yaml 后使用

server:
  port: 23523
  jwt_secret: "change-this-to-a-secure-random-string"

database:
  host: mysql          # Docker 服务名
  port: 3306
  user: prism
  password: prism123456
  dbname: prism

redis:
  addr: redis:6379     # Docker 服务名
  password: ""
  db: 0

file_storage:
  base_url: ""              # x-file-storage service URL; blank disables managed file storage
  api_key: ""               # x-file-storage API key
  upload_path: "Prism/"
  max_file_size_mb: 64
  max_total_size_mb: 1024    # Per-token Files API quota
  allowed_types:
    - "image/png"
    - "image/jpeg"
    - "image/gif"
    - "image/webp"
    - "application/pdf"
    - "text/plain"
    - "text/csv"
    - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"

observability:
  retain_api_call_payloads: false
  api_call_payload_retention_hours: 168
  api_call_payload_max_bytes: 262144
  api_call_metadata_retention_days: 90
  resource_history_retention_days: 90 # 终态异步任务与闲置 Playground 对话历史
  api_access_log_retention_days: 30
  audit_event_retention_days: 180
  billing_ledger_retention_days: 365
