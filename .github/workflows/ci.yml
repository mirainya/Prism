name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install frontend dependencies
        working-directory: console
        run: npm ci

      - name: Check frontend types
        working-directory: console
        run: npx tsc --noEmit

      - name: Test frontend
        working-directory: console
        run: npm test

      - name: Build frontend
        working-directory: console
        run: npm run build

      - name: Test backend
        run: go test ./...

      - name: Vet backend
        run: go vet ./...

      - name: Check backend statically
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 '-checks=all,-ST*' ./...

      - name: Build container image
        run: |
          docker build --tag prism:ci .
          test "$(docker image inspect prism:ci --format '{{.Config.User}}')" = "prism"
          test "$(docker image inspect prism:ci --format '{{json .Config.Healthcheck.Test}}')" != "null"

  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: prism-ci
          MYSQL_DATABASE: prism
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pprism-ci"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test MySQL migration lifecycle
        env:
          PRISM_MIGRATION_TEST_DSN: "root:prism-ci@tcp(127.0.0.1:3306)/prism?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true"
        run: go test -tags=integration ./internal/migrate -run TestMySQLMigrationLifecycle -count=1
